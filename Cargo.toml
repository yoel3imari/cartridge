[package]
name = "cartridge"
version = "0.1.0"
edition = "2024"
description = "The application cartridge manager for Linux"
authors = ["yoel3imari"]
license = "MIT"
repository = "https://github.com/yoel3imari/cartridge"
homepage = "https://github.com/yoel3imari/cartridge"
readme = "README.md"
keywords = ["appimage", "cartridge", "package-manager", "cli", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[lib]
name = "cartridge"
path = "src/lib.rs"

[[bin]]
name = "cart"
path = "src/bin/cart.rs"

[[bin]]
name = "cartridge"
path = "src/bin/cartridge.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
tokio = { version = "1.39", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"
comfy-table = "7.1"
fuzzy-matcher = "0.3"
tempfile = "3.12"
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3"
directories = "5.0"
sha2 = "0.10"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
