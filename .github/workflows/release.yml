name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: false
            install_musl: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (for x86_64-musl)
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for ARM cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_NAME="aim-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/aim" "dist/${PKG_NAME}/"
          cp README.md LICENSE "dist/${PKG_NAME}/"

          # Generate completions
          mkdir -p "dist/${PKG_NAME}/completions"
          ./target/${{ matrix.target }}/release/aim completions bash > "dist/${PKG_NAME}/completions/aim.bash" 2>/dev/null || true
          ./target/${{ matrix.target }}/release/aim completions zsh > "dist/${PKG_NAME}/completions/_aim" 2>/dev/null || true
          ./target/${{ matrix.target }}/release/aim completions fish > "dist/${PKG_NAME}/completions/aim.fish" 2>/dev/null || true

          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
